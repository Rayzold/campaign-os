<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 DM Music & Media</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --orange:#f97316; --purple:#a855f7; --teal:#14b8a6; --blue:#3b82f6; --bg:#08080f; --surface:#0f0f1a; --surface2:#161625; --border:#1e1e2e; --muted:#4a4a6a; --text:#e2e8f0; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Courier New',monospace;overflow:hidden;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1000;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);}

  ::-webkit-scrollbar{width:4px;height:4px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--muted);border-radius:2px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--teal);}

  input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);
    border-radius:4px;padding:4px 8px;font-family:inherit;font-size:.8rem;outline:none;transition:border-color .15s;}
  input:focus,select:focus{border-color:var(--teal);}

  .btn-primary{background:var(--teal);color:#000;font-weight:bold;border:none;border-radius:5px;
    padding:6px 14px;font-family:inherit;font-size:.75rem;cursor:pointer;transition:all .15s;letter-spacing:.04em;}
  .btn-primary:hover{background:#2dd4bf;box-shadow:0 0 14px rgba(20,184,166,.5);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:5px;
    padding:5px 10px;font-family:inherit;font-size:.72rem;cursor:pointer;transition:all .15s;}
  .btn-ghost:hover{border-color:var(--teal);color:var(--teal);}
  .btn-present{background:transparent;border:1px solid rgba(168,85,247,.4);color:var(--purple);border-radius:5px;
    padding:5px 10px;font-family:inherit;font-size:.72rem;cursor:pointer;transition:all .15s;}
  .btn-present:hover{background:rgba(168,85,247,.1);box-shadow:0 0 12px rgba(168,85,247,.3);}

  .tab-btn{background:none;border:none;border-bottom:2px solid transparent;padding:8px 16px;
    font-family:inherit;font-size:.75rem;letter-spacing:.08em;cursor:pointer;color:var(--muted);transition:all .15s;}
  .tab-btn.active{border-bottom-color:var(--teal);color:var(--teal);}

  .file-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;
    border:1px solid transparent;cursor:pointer;transition:all .12s;}
  .file-row:hover{background:var(--surface2);border-color:var(--border);}
  .file-row.playing{background:rgba(20,184,166,.07);border-color:rgba(20,184,166,.3);}

  .cat-btn{width:100%;text-align:left;background:none;border:none;border-radius:5px;padding:6px 10px;
    font-family:inherit;font-size:.72rem;cursor:pointer;color:var(--muted);transition:all .12s;display:flex;justify-content:space-between;align-items:center;}
  .cat-btn:hover{background:var(--surface2);color:var(--text);}
  .cat-btn.active{background:rgba(20,184,166,.1);color:var(--teal);}

  .badge{font-size:.58rem;padding:1px 6px;border-radius:10px;font-weight:bold;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;}

  /* Audio player bar */
  #player-bar{position:fixed;bottom:0;left:0;right:0;z-index:200;
    background:#09091a;border-top:1px solid var(--border);padding:8px 16px;
    display:none;align-items:center;gap:14px;}
  #player-bar.visible{display:flex;}

  #progress-wrap{flex:1;height:4px;background:var(--border);border-radius:2px;cursor:pointer;position:relative;}
  #progress-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .1s linear;pointer-events:none;}

  .ctrl-btn{background:none;border:none;color:var(--text);font-size:1.1rem;cursor:pointer;
    padding:4px;transition:color .12s;line-height:1;}
  .ctrl-btn:hover{color:var(--teal);}

  /* Video modal */
  #video-modal{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.92);
    align-items:center;justify-content:center;flex-direction:column;gap:12px;}
  #video-modal.open{display:flex;}
  #video-modal video{max-width:90vw;max-height:80vh;border-radius:8px;border:1px solid var(--border);}

  .section-label{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}

  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{animation:spin 1s linear infinite;display:inline-block;}

  #toast{position:fixed;bottom:80px;right:1rem;z-index:999;padding:.45rem 1rem;
    background:var(--surface2);border:1px solid var(--teal);border-radius:6px;
    color:var(--teal);font-size:.75rem;transform:translateY(60px);transition:transform .3s;pointer-events:none;}
  #toast.show{transform:translateY(0);}
</style>
</head>
<body>

<div id="toast"></div>

<!-- ═══ VIDEO MODAL ═══ -->
<div id="video-modal" onclick="closeVideoModal(event)">
  <div style="display:flex;gap:8px;z-index:1;">
    <button onclick="closeVideoModal()" class="btn-ghost">✕ Close</button>
    <button id="btn-present" class="btn-present">🖥 Present (New Window)</button>
    <button id="btn-fullscreen" class="btn-ghost">⛶ Fullscreen</button>
  </div>
  <video id="modal-video" controls loop style="background:#000;"></video>
  <div id="modal-video-name" style="font-size:.75rem;color:var(--muted);"></div>
</div>

<!-- ═══ MAIN LAYOUT ═══ -->
<div style="position:relative;z-index:10;display:flex;flex-direction:column;height:100vh;">

  <!-- TOP BAR -->
  <div style="flex-shrink:0;background:#09091a;border-bottom:1px solid var(--border);padding:7px 16px;display:flex;align-items:center;gap:14px;">
    <a href="index.html" style="color:var(--muted);font-size:.75rem;text-decoration:none;letter-spacing:.05em;transition:color .15s;flex-shrink:0;"
      onmouseover="this.style.color='var(--teal)'" onmouseout="this.style.color='var(--muted)'">← SUITE</a>
    <div style="width:1px;height:24px;background:var(--border);"></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="color:var(--teal);font-size:1rem;">🎵</span>
      <span style="font-weight:bold;font-size:.82rem;letter-spacing:.08em;">MUSIC & MEDIA</span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:5px;">
      <button id="open-audio-btn" class="btn-primary" onclick="openAudioFolder()">📁 Open Audio Folder</button>
      <button id="open-video-btn" class="btn-ghost" onclick="openVideoFolder()">📁 Open Video Folder</button>
    </div>
  </div>

  <!-- TABS -->
  <div style="flex-shrink:0;background:#09091a;border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:0;">
    <button class="tab-btn active" id="tab-audio" onclick="setTab('audio')">🎵 AUDIO</button>
    <button class="tab-btn" id="tab-video" onclick="setTab('video')">🎬 VIDEO</button>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
      <input type="text" id="search" placeholder="search files..." oninput="onSearch(this.value)"
        style="width:180px;font-size:.75rem;">
    </div>
  </div>

  <!-- CONTENT -->
  <div style="flex:1;display:flex;overflow:hidden;">

    <!-- SIDEBAR: Categories -->
    <div id="sidebar" style="width:180px;flex-shrink:0;border-right:1px solid var(--border);padding:10px 8px;overflow-y:auto;background:var(--surface);">
      <div class="section-label" style="padding:2px 6px;margin-bottom:8px;">Categories</div>
      <div id="cat-list"></div>
    </div>

    <!-- FILE LIST -->
    <div style="flex:1;overflow-y:auto;padding:10px 12px;" id="file-area">
      <div id="empty-state" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--border);text-align:center;padding:40px;">
        <div style="font-size:3rem;margin-bottom:12px;opacity:.4;">🎵</div>
        <div style="font-size:.82rem;color:#1e1e2e;letter-spacing:.1em;margin-bottom:6px;">NO FOLDER OPEN</div>
        <div style="font-size:.7rem;color:#161625;">Click "Open Audio Folder" to browse your music</div>
        <div style="font-size:.65rem;color:#0f0f1a;margin-top:4px;">Requires Chrome or Edge</div>
      </div>
      <div id="file-list" style="display:flex;flex-direction:column;gap:2px;"></div>
    </div>

  </div>
</div>

<!-- ═══ AUDIO PLAYER BAR ═══ -->
<div id="player-bar">
  <!-- Track info -->
  <div style="min-width:0;flex-shrink:0;max-width:220px;">
    <div id="track-name" style="font-size:.75rem;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--teal);"></div>
    <div id="track-cat" style="font-size:.6rem;color:var(--muted);margin-top:1px;"></div>
  </div>

  <!-- Controls -->
  <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
    <button class="ctrl-btn" onclick="prevTrack()" title="Previous">⏮</button>
    <button class="ctrl-btn" id="play-btn" onclick="togglePlay()" style="font-size:1.3rem;">▶</button>
    <button class="ctrl-btn" onclick="nextTrack()" title="Next">⏭</button>
  </div>

  <!-- Progress -->
  <div style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;">
    <div id="progress-wrap" onclick="seekAudio(event)">
      <div id="progress-fill" style="width:0%"></div>
    </div>
    <div style="display:flex;justify-content:space-between;">
      <span id="time-cur" style="font-size:.58rem;color:var(--muted);">0:00</span>
      <span id="time-dur" style="font-size:.58rem;color:var(--muted);">0:00</span>
    </div>
  </div>

  <!-- Volume + Loop -->
  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
    <span style="font-size:.8rem;">🔊</span>
    <input type="range" id="vol" min="0" max="1" step="0.02" value="0.8" oninput="setVolume(this.value)"
      style="width:70px;accent-color:var(--teal);cursor:pointer;">
    <button id="loop-btn" class="btn-ghost" onclick="toggleLoop()" style="font-size:.65rem;padding:3px 7px;">🔁 Loop</button>
    <button class="btn-ghost" onclick="stopAudio()" style="font-size:.65rem;padding:3px 7px;color:rgba(239,68,68,.6);border-color:rgba(239,68,68,.3);">■ Stop</button>
  </div>
</div>

<!-- Hidden audio element -->
<audio id="audio" onended="onTrackEnd()" ontimeupdate="updateProgress()" onloadedmetadata="onMeta()"></audio>

<script>
// ═══════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════
const AUDIO_EXTS = ['mp3','wav','ogg','flac','m4a','aac','opus','wma','aiff']
const VIDEO_EXTS = ['mp4','webm','mkv','mov','avi','m4v','ogv','wmv']
const STORAGE_KEY = 'sl-music-tags'

const AUDIO_CATS = [
  { id:'ambience',    label:'🌿 Ambience',     color:'#22c55e'  },
  { id:'battle',      label:'⚔️ Battle',        color:'#ef4444'  },
  { id:'exploration', label:'🗺️ Exploration',   color:'#14b8a6'  },
  { id:'tension',     label:'😰 Tension',       color:'#f97316'  },
  { id:'epic',        label:'🎺 Epic',           color:'#a855f7'  },
  { id:'town',        label:'🏙️ Town / Tavern', color:'#eab308'  },
  { id:'dark',        label:'💀 Dark / Horror', color:'#94a3b8'  },
  { id:'other',       label:'🎵 Other',          color:'#64748b'  },
  { id:'uncategorized', label:'❓ Unsorted',    color:'#2a2a3a'  },
]

const VIDEO_CATS = [
  { id:'temple-amb',       label:'🏛 Temple — Ambience',      color:'#c084fc', group:'Temple'     },
  { id:'temple-battle',    label:'🏛 Temple — Battle',         color:'#ef4444', group:'Temple'     },
  { id:'city-amb',         label:'🏙 City / Town — Ambience', color:'#eab308', group:'City'       },
  { id:'city-battle',      label:'🏙 City / Town — Battle',   color:'#ef4444', group:'City'       },
  { id:'wilderness-amb',   label:'🌲 Wilderness — Ambience',  color:'#22c55e', group:'Wilderness' },
  { id:'wilderness-battle',label:'🌲 Wilderness — Battle',    color:'#ef4444', group:'Wilderness' },
  { id:'dungeon-amb',      label:'🏚 Dungeon — Ambience',     color:'#a855f7', group:'Dungeon'    },
  { id:'dungeon-battle',   label:'🏚 Dungeon — Battle',       color:'#ef4444', group:'Dungeon'    },
  { id:'overworld-amb',    label:'🌍 Overworld — Ambience',   color:'#14b8a6', group:'Overworld'  },
  { id:'overworld-battle', label:'🌍 Overworld — Battle',     color:'#ef4444', group:'Overworld'  },
  { id:'cave-amb',         label:'🕳 Cave — Ambience',        color:'#a8a29e', group:'Cave'       },
  { id:'cave-battle',      label:'🕳 Cave — Battle',          color:'#ef4444', group:'Cave'       },
  { id:'ruins-amb',        label:'🏗 Ruins — Ambience',       color:'#78716c', group:'Ruins'      },
  { id:'ruins-battle',     label:'🏗 Ruins — Battle',         color:'#ef4444', group:'Ruins'      },
  { id:'ship-amb',         label:'⛵ Ship / Sea — Ambience',  color:'#3b82f6', group:'Ship'       },
  { id:'ship-battle',      label:'⛵ Ship / Sea — Battle',    color:'#ef4444', group:'Ship'       },
  { id:'cinematic',        label:'🎬 Cinematic',               color:'#60a5fa', group:null         },
  { id:'other',            label:'📽 Other',                   color:'#64748b', group:null         },
  { id:'uncategorized',    label:'❓ Unsorted',               color:'#2a2a3a', group:null         },
]

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
const S = {
  tab: 'audio',
  audioFiles: [],
  videoFiles: [],
  audioHandle: null,
  videoHandle: null,
  tags: {},          // {filename: categoryId}
  activeCat: 'all',
  search: '',
  currentIdx: -1,
  playlist: [],      // filtered audio file list for navigation
  looping: false,
}

// ═══════════════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════════════
function saveTags() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S.tags)) } catch(e){} }
function loadTags() { try { const r = localStorage.getItem(STORAGE_KEY); if(r) S.tags = JSON.parse(r) } catch(e){} }

function getTag(name, isVideo) {
  return S.tags[name] || 'uncategorized'
}
function setTag(name, cat) {
  S.tags[name] = cat
  saveTags()
}

// ═══════════════════════════════════════════════════
// FILE SYSTEM
// ═══════════════════════════════════════════════════
async function openAudioFolder() {
  if (!window.showDirectoryPicker) { toast('Requires Chrome or Edge browser'); return }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'read' })
    S.audioHandle = handle
    S.audioFiles = []
    const btn = document.getElementById('open-audio-btn')
    btn.textContent = '⏳ Scanning...'
    btn.disabled = true
    await scanDir(handle, S.audioFiles, AUDIO_EXTS)
    // Apply saved tags
    for (const f of S.audioFiles) f.category = getTag(f.name)
    btn.textContent = `📁 ${handle.name} (${S.audioFiles.length})`
    btn.disabled = false
    toast(`Found ${S.audioFiles.length} audio files`)
    render()
  } catch(e) {
    document.getElementById('open-audio-btn').textContent = '📁 Open Audio Folder'
    document.getElementById('open-audio-btn').disabled = false
    if (e.name !== 'AbortError') toast('Could not open folder')
  }
}

async function openVideoFolder() {
  if (!window.showDirectoryPicker) { toast('Requires Chrome or Edge browser'); return }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'read' })
    S.videoHandle = handle
    S.videoFiles = []
    const btn = document.getElementById('open-video-btn')
    btn.textContent = '⏳ Scanning...'
    btn.disabled = true
    await scanDir(handle, S.videoFiles, VIDEO_EXTS)
    for (const f of S.videoFiles) f.category = getTag(f.name, true)
    btn.textContent = `📁 ${handle.name} (${S.videoFiles.length})`
    btn.disabled = false
    toast(`Found ${S.videoFiles.length} video files`)
    render()
  } catch(e) {
    document.getElementById('open-video-btn').textContent = '📁 Open Video Folder'
    document.getElementById('open-video-btn').disabled = false
    if (e.name !== 'AbortError') toast('Could not open folder')
  }
}

async function scanDir(dirHandle, results, exts, path = '') {
  for await (const [name, entry] of dirHandle.entries()) {
    if (entry.kind === 'directory') {
      await scanDir(entry, results, exts, path ? `${path}/${name}` : name)
    } else {
      const ext = name.split('.').pop().toLowerCase()
      if (exts.includes(ext)) {
        results.push({ name, path: path ? `${path}/${name}` : name, handle: entry, url: null, category: 'uncategorized' })
      }
    }
  }
}

async function getURL(fileEntry) {
  if (fileEntry.url) return fileEntry.url
  const file = await fileEntry.handle.getFile()
  fileEntry.url = URL.createObjectURL(file)
  return fileEntry.url
}

// ═══════════════════════════════════════════════════
// FILTERS
// ═══════════════════════════════════════════════════
function setTab(t) {
  S.tab = t; S.activeCat = 'all'; S.search = ''
  document.getElementById('search').value = ''
  document.getElementById('tab-audio').classList.toggle('active', t === 'audio')
  document.getElementById('tab-video').classList.toggle('active', t === 'video')
  document.getElementById('open-audio-btn').style.display = t === 'audio' ? '' : 'none'
  document.getElementById('open-video-btn').style.display = t === 'video' ? '' : 'none'
  render()
}

function onSearch(v) { S.search = v.toLowerCase(); render() }

function setCat(cat) { S.activeCat = cat; render() }

function currentFiles() {
  return S.tab === 'audio' ? S.audioFiles : S.videoFiles
}

function currentCats() {
  return S.tab === 'audio' ? AUDIO_CATS : VIDEO_CATS
}

function filtered() {
  const files = currentFiles()
  return files.filter(f => {
    if (S.activeCat !== 'all' && f.category !== S.activeCat) return false
    if (S.search && !f.name.toLowerCase().includes(S.search) && !f.path.toLowerCase().includes(S.search)) return false
    return true
  })
}

// ═══════════════════════════════════════════════════
// AUDIO PLAYER
// ═══════════════════════════════════════════════════
const audio = document.getElementById('audio')

async function playFile(fileEntry, idx) {
  S.currentIdx = idx
  const url = await getURL(fileEntry)
  audio.src = url
  audio.volume = parseFloat(document.getElementById('vol').value)
  audio.play()
  document.getElementById('play-btn').textContent = '⏸'
  document.getElementById('player-bar').classList.add('visible')
  document.getElementById('track-name').textContent = fileEntry.name.replace(/\.[^.]+$/, '')
  const cats = AUDIO_CATS
  const cat = cats.find(c => c.id === fileEntry.category)
  document.getElementById('track-cat').textContent = cat ? cat.label : fileEntry.category
  renderList() // update playing highlight
}

function togglePlay() {
  if (audio.paused) { audio.play(); document.getElementById('play-btn').textContent = '⏸' }
  else { audio.pause(); document.getElementById('play-btn').textContent = '▶' }
}

function stopAudio() {
  audio.pause(); audio.src = ''
  S.currentIdx = -1
  document.getElementById('player-bar').classList.remove('visible')
  renderList()
}

function prevTrack() {
  const list = filtered()
  if (!list.length) return
  const newIdx = S.currentIdx <= 0 ? list.length - 1 : S.currentIdx - 1
  playFile(list[newIdx], newIdx)
}

function nextTrack() {
  const list = filtered()
  if (!list.length) return
  const newIdx = (S.currentIdx + 1) % list.length
  playFile(list[newIdx], newIdx)
}

function onTrackEnd() {
  if (S.looping) { audio.play(); return }
  nextTrack()
}

function toggleLoop() {
  S.looping = !S.looping
  const btn = document.getElementById('loop-btn')
  btn.style.color = S.looping ? 'var(--teal)' : ''
  btn.style.borderColor = S.looping ? 'var(--teal)' : ''
}

function setVolume(v) { audio.volume = parseFloat(v) }

function seekAudio(e) {
  if (!audio.duration) return
  const rect = e.currentTarget.getBoundingClientRect()
  const ratio = (e.clientX - rect.left) / rect.width
  audio.currentTime = ratio * audio.duration
}

function updateProgress() {
  if (!audio.duration) return
  const pct = (audio.currentTime / audio.duration) * 100
  document.getElementById('progress-fill').style.width = pct + '%'
  document.getElementById('time-cur').textContent = fmtTime(audio.currentTime)
}

function onMeta() {
  document.getElementById('time-dur').textContent = fmtTime(audio.duration)
}

function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00'
  const m = Math.floor(s / 60), sec = Math.floor(s % 60)
  return `${m}:${sec.toString().padStart(2,'0')}`
}

// ═══════════════════════════════════════════════════
// VIDEO PLAYER
// ═══════════════════════════════════════════════════
let currentVideoEntry = null

async function openVideo(fileEntry) {
  currentVideoEntry = fileEntry
  const url = await getURL(fileEntry)
  const vid = document.getElementById('modal-video')
  vid.src = url
  vid.play()
  document.getElementById('modal-video-name').textContent = fileEntry.path
  document.getElementById('video-modal').classList.add('open')
}

async function downloadVideo(fileEntry) {
  const url = await getURL(fileEntry)
  const a = document.createElement('a')
  a.href = url
  a.download = fileEntry.name
  a.click()
  toast('File saved to Downloads — open it with any player')
}

function showPath(fileEntry) {
  const rootName = S.videoHandle ? S.videoHandle.name : 'selected folder'
  const fullPath = rootName + '/' + fileEntry.path
  const d = document.createElement('div')
  d.style.cssText = 'position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;'
  d.innerHTML = `<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px;max-width:520px;width:90%;font-family:Courier New,monospace;">
    <div style="font-size:.6rem;color:var(--muted);letter-spacing:.1em;margin-bottom:8px;">FILE LOCATION</div>
    <div style="font-size:.78rem;color:var(--teal);word-break:break-all;line-height:1.6;margin-bottom:14px;">${fullPath}</div>
    <div style="font-size:.65rem;color:var(--muted);margin-bottom:14px;">Open your file manager and navigate to the folder above to open this file with any program.</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button onclick="navigator.clipboard.writeText('${fullPath.replace(/'/g,"\\'")}');toast('Path copied!')" style="background:none;border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:5px 14px;font-family:inherit;font-size:.72rem;cursor:pointer;">Copy Path</button>
      <button onclick="this.closest('[style*=fixed]').remove()" style="background:var(--teal);color:#000;border:none;border-radius:5px;padding:5px 14px;font-family:inherit;font-size:.72rem;font-weight:bold;cursor:pointer;">Close</button>
    </div>
  </div>`
  document.body.appendChild(d)
  d.addEventListener('click', e => { if (e.target === d) d.remove() })
}

function closeVideoModal(e) {
  if (e && e.target !== document.getElementById('video-modal') && e.type === 'click') {
    const modal = document.getElementById('video-modal')
    if (!e.target.closest || e.target.closest('#video-modal') !== modal) return
    if (e.target !== modal) return
  }
  const vid = document.getElementById('modal-video')
  vid.pause(); vid.src = ''
  document.getElementById('video-modal').classList.remove('open')
  currentVideoEntry = null
}

document.getElementById('btn-present').onclick = async () => {
  if (!currentVideoEntry) return
  const url = await getURL(currentVideoEntry)
  const w = window.open('about:blank', '_blank', 'width=1280,height=720,menubar=no,toolbar=no,location=no')
  const name = currentVideoEntry.name
  w.document.write(`<!DOCTYPE html><html><head><title>${name}</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}
    video{width:100vw;height:100vh;object-fit:contain}
    .hint{position:fixed;bottom:10px;right:10px;font-family:monospace;font-size:11px;color:rgba(255,255,255,.3);pointer-events:none;}
    </style></head>
    <body><video src="${url}" autoplay controls loop></video>
    <div class="hint">F11 = fullscreen</div>
    </body></html>`)
  w.document.close()
}

document.getElementById('btn-fullscreen').onclick = () => {
  const vid = document.getElementById('modal-video')
  if (vid.requestFullscreen) vid.requestFullscreen()
  else if (vid.webkitRequestFullscreen) vid.webkitRequestFullscreen()
}

// ═══════════════════════════════════════════════════
// CATEGORY ASSIGNMENT
// ═══════════════════════════════════════════════════
function assignCat(fileEntry, catId) {
  fileEntry.category = catId
  setTag(fileEntry.name, catId)
  render()
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function catColor(catId, isVideo) {
  const list = isVideo ? VIDEO_CATS : AUDIO_CATS
  return (list.find(c => c.id === catId) || {}).color || '#4a4a6a'
}

function catLabel(catId, isVideo) {
  const list = isVideo ? VIDEO_CATS : AUDIO_CATS
  return (list.find(c => c.id === catId) || {}).label || catId
}

function render() { renderSidebar(); renderList() }

function renderSidebar() {
  const cats = currentCats()
  const files = currentFiles()
  const counts = {}
  for (const f of files) counts[f.category] = (counts[f.category] || 0) + 1

  const isVideo = S.tab === 'video'

  let html = `<button class="cat-btn ${S.activeCat==='all'?'active':''}" onclick="setCat('all')">
    <span>All files</span>
    <span style="font-size:.6rem;color:var(--muted);">${files.length}</span>
  </button>`

  if (isVideo) {
    // Grouped rendering for video
    const groups = []
    const seen = new Set()
    for (const c of cats) {
      if (c.group && !seen.has(c.group)) { groups.push(c.group); seen.add(c.group) }
    }
    const ungrouped = cats.filter(c => !c.group)

    for (const g of groups) {
      const members = cats.filter(c => c.group === g)
      const groupCount = members.reduce((s, c) => s + (counts[c.id] || 0), 0)
      html += `<div style="font-size:.55rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;padding:8px 10px 2px;margin-top:4px;">${g} <span style="opacity:.5;">${groupCount||''}</span></div>`
      for (const c of members) {
        const isAmb = c.id.endsWith('-amb')
        html += `<button class="cat-btn ${S.activeCat===c.id?'active':''}" onclick="setCat('${c.id}')"
          style="color:${S.activeCat===c.id?c.color:''};padding-left:18px;">
          <span style="font-size:.68rem;">${isAmb ? '🔊 Ambience' : '⚔ Battle'}</span>
          <span style="font-size:.6rem;color:var(--muted);">${counts[c.id]||0}</span>
        </button>`
      }
    }
    if (ungrouped.length) {
      html += `<div style="height:1px;background:var(--border);margin:8px 4px;"></div>`
      for (const c of ungrouped) {
        html += `<button class="cat-btn ${S.activeCat===c.id?'active':''}" onclick="setCat('${c.id}')"
          style="color:${S.activeCat===c.id?c.color:''}">
          <span>${c.label}</span>
          <span style="font-size:.6rem;color:var(--muted);">${counts[c.id]||0}</span>
        </button>`
      }
    }
  } else {
    html += cats.map(c =>
      `<button class="cat-btn ${S.activeCat===c.id?'active':''}" onclick="setCat('${c.id}')"
         style="color:${S.activeCat===c.id ? c.color : ''}">
         <span>${c.label}</span>
         <span style="font-size:.6rem;color:var(--muted);">${counts[c.id]||0}</span>
       </button>`
    ).join('')
  }

  document.getElementById('cat-list').innerHTML = html
}

function renderList() {
  const files = filtered()
  const isVideo = S.tab === 'video'
  const listEl = document.getElementById('file-list')
  const emptyEl = document.getElementById('empty-state')

  const hasFolder = isVideo ? S.videoFiles.length > 0 : S.audioFiles.length > 0
  if (!hasFolder) {
    emptyEl.style.display = 'flex'; listEl.innerHTML = ''
    emptyEl.innerHTML = `<div style="font-size:2.5rem;margin-bottom:12px;opacity:.3;">${isVideo?'🎬':'🎵'}</div>
      <div style="font-size:.82rem;color:#1e1e2e;letter-spacing:.1em;margin-bottom:6px;">NO FOLDER OPEN</div>
      <div style="font-size:.7rem;color:#161625;">Click "Open ${isVideo?'Video':'Audio'} Folder" above</div>`
    return
  }

  emptyEl.style.display = 'none'

  if (!files.length) {
    listEl.innerHTML = `<div style="color:var(--muted);font-size:.78rem;text-align:center;padding:30px;">No files match</div>`
    return
  }

  listEl.innerHTML = files.map((f, i) => {
    const color = catColor(f.category, isVideo)
    const label = catLabel(f.category, isVideo)
    const isPlaying = !isVideo && i === S.currentIdx

    const catOptions = currentCats().map(c =>
      `<option value="${c.id}" ${f.category===c.id?'selected':''}>${c.label}</option>`
    ).join('')

    const pathParts = f.path.split('/')
    const subfolder = pathParts.length > 1 ? pathParts.slice(0,-1).join('/') + '/' : ''

    if (isVideo) {
      return `<div class="file-row" style="border-color:transparent;align-items:flex-start;gap:10px;padding:10px;">
        <span style="font-size:1rem;flex-shrink:0;margin-top:2px;">🎬</span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:.8rem;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${f.path}">${f.name.replace(/\.[^.]+$/,'')}</div>
          ${subfolder ? `<div style="font-size:.6rem;color:var(--muted);margin-top:1px;">${subfolder}</div>` : ''}
          <div style="display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;">
            <button onclick="openVideo(S.videoFiles.find(x=>x.name==='${esc(f.name)}'))" class="btn-present" style="font-size:.68rem;padding:4px 10px;flex-shrink:0;">▶ Play</button>
            <button onclick="downloadVideo(S.videoFiles.find(x=>x.name==='${esc(f.name)}'))" class="btn-ghost" style="font-size:.68rem;padding:4px 10px;flex-shrink:0;" title="Download so you can open with any program">⎋ Open With…</button>
            <button onclick="showPath(S.videoFiles.find(x=>x.name==='${esc(f.name)}'))" class="btn-ghost" style="font-size:.68rem;padding:4px 10px;flex-shrink:0;">📂 Folder</button>
          </div>
        </div>
        <select onchange="assignCat(S.videoFiles.find(x=>x.name==='${esc(f.name)}'), this.value)"
          style="font-size:.65rem;padding:2px 4px;border-color:${color};color:${color};width:130px;flex-shrink:0;"
          onclick="event.stopPropagation()">
          ${catOptions}
        </select>
      </div>`
    }

    return `<div class="file-row ${isPlaying?'playing':''}"
      onclick="playFile(S.audioFiles.find(x=>x.name==='${esc(f.name)}'), ${S.audioFiles.indexOf(f)})">
      <span style="font-size:.85rem;flex-shrink:0;">${isPlaying ? '🔊' : '♪'}</span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:.78rem;font-weight:${isPlaying?'bold':'normal'};color:${isPlaying?'var(--teal)':'var(--text)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${f.name.replace(/\.[^.]+$/,'')}</div>
        ${subfolder ? `<div style="font-size:.6rem;color:var(--muted);">${subfolder}</div>` : ''}
      </div>
      <select onchange="assignCatAudio(this, '${esc(f.name)}', this.value)"
        style="font-size:.65rem;padding:2px 4px;border-color:${color};color:${color};max-width:140px;"
        onclick="event.stopPropagation()">
        ${catOptions}
      </select>
    </div>`
  }).join('')
}

function assignCatAudio(sel, name, catId) {
  const f = S.audioFiles.find(x => x.name === name)
  if (f) { f.category = catId; setTag(name, catId); renderSidebar() }
}

function esc(s) { return String(s||'').replace(/'/g,"\\'") }

// ═══════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════
let toastT
function toast(msg) {
  const el = document.getElementById('toast')
  el.textContent = msg; el.classList.add('show')
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2800)
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
loadTags()
setTab('audio')

// Keyboard: Space = play/pause
document.addEventListener('keydown', e => {
  if (['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return
  if (e.key === ' ') { e.preventDefault(); if (audio.src) togglePlay() }
  if (e.key === 'Escape') closeVideoModal()
  if (e.key === 'ArrowRight') nextTrack()
  if (e.key === 'ArrowLeft') prevTrack()
})
</script>
